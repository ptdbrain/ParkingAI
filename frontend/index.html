<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edge AI Parking Dashboard</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7f5;
        --ink: #17211b;
        --muted: #5f6b63;
        --line: #cbd8cf;
        --accent: #0f7c63;
        --danger: #c9362b;
        --warn: #be7b00;
      }

      body {
        margin: 0;
        background: linear-gradient(135deg, #f4f7f5 0%, #e8efe9 52%, #f7f4ee 100%);
        color: var(--ink);
        font-family: "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        grid-template-columns: minmax(280px, 1fr) 360px;
        min-height: 100vh;
      }

      .map {
        padding: 32px;
      }

      .slots {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 14px;
        max-width: 760px;
      }

      .slot {
        aspect-ratio: 1.4;
        border: 2px solid var(--line);
        border-radius: 8px;
        display: grid;
        place-items: center;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.72);
      }

      .slot.occupied {
        border-color: var(--accent);
        background: #dff3ec;
      }

      .slot.alert {
        border-color: var(--danger);
        background: #ffe4df;
      }

      aside {
        border-left: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.78);
        padding: 24px;
        overflow: auto;
      }

      h1 {
        margin: 0 0 24px;
        font-size: 28px;
      }

      h2 {
        margin: 0 0 16px;
        font-size: 18px;
      }

      .event {
        border-bottom: 1px solid var(--line);
        padding: 12px 0;
        font-size: 14px;
      }

      .event strong {
        display: block;
        margin-bottom: 4px;
      }

      .muted {
        color: var(--muted);
      }

      @media (max-width: 760px) {
        main {
          grid-template-columns: 1fr;
        }

        aside {
          border-left: 0;
          border-top: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="map">
        <h1>Edge AI Parking Dashboard</h1>
        <div class="slots" id="slots"></div>
      </section>
      <aside>
        <h2>Live Events</h2>
        <div id="events" class="muted">Waiting for WebSocket events...</div>
      </aside>
    </main>
    <script>
      const slots = document.querySelector("#slots");
      const events = document.querySelector("#events");
      ["A-01", "A-02", "A-03", "A-04", "B-01", "B-02", "B-03", "B-04"].forEach((code, index) => {
        const slot = document.createElement("div");
        slot.className = `slot ${index % 3 === 0 ? "occupied" : ""}`;
        slot.textContent = code;
        slots.appendChild(slot);
      });

      const socket = new WebSocket(`ws://${location.hostname || "localhost"}:8000/ws/live`);
      socket.onmessage = (message) => {
        const payload = JSON.parse(message.data);
        if (payload.type === "heartbeat") return;
        if (events.classList.contains("muted")) {
          events.textContent = "";
          events.classList.remove("muted");
        }
        const item = document.createElement("div");
        item.className = "event";
        item.innerHTML = `<strong>${payload.type.toUpperCase()} confidence=${payload.confidence}</strong><span>${payload.plate_text || payload.description || payload.timestamp}</span>`;
        events.prepend(item);
      };
    </script>
  </body>
</html>
